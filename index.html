<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompteca</title>
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/x-icon" href="image/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="image/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="image/android-chrome-512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app" id="appRoot" data-layout="list">
  <aside class="side" id="side" aria-label="Modelos salvos">
    <div class="side-head">
      <div class="brand-row">
        <div class="brand"><img src="image/android-chrome-192x192.png" alt="" width="30" height="30"><span>Prompteca</span></div>
        <button class="ib collapse-btn" id="collapseSideBtn" type="button" aria-label="Recolher barra lateral" title="Recolher barra lateral">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <div class="side-title"><span>Modelos</span><span id="count">0</span></div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar modelo ou subprompt…" autocomplete="off">
      </label>
    </div>
    <ul class="list" id="list"></ul>
    <div class="status" id="status" hidden></div>
  </aside>

  <main class="panel">
    <div class="panel-head">
      <button class="ib layout-btn" id="toggleLayoutBtn" type="button" aria-pressed="false" aria-label="Ampliar área do prompt" title="Ampliar área do prompt">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 9l-3 3 3 3"/></svg>
      </button>
      <h1 id="title">Prompteca</h1>
      <span class="meta" id="meta"></span>
      <div class="auth">
        <button class="user-btn" id="userBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="authPop" aria-label="Conta">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="pop" id="authPop" role="dialog" aria-label="Conta" hidden>
          <form id="loginForm" novalidate>
            <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
            <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
            <div class="err" id="authErr"></div>
            <button class="go" id="entrar" type="submit">Entrar</button>
          </form>
          <div id="acct" hidden>
            <div class="who"><span class="av" id="av"></span><span style="min-width:0"><span class="em" id="whoEmail"></span><small>Conectado</small></span></div>
            <button class="out" id="sair" type="button">
              <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>Sair
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-body" id="body" aria-live="polite"></div>
    <nav class="dock" id="dock" aria-label="Ações"></nav>
    <div class="toast" id="toast" role="status"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
