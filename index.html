<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompteca</title>
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/x-icon" href="image/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="image/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="image/android-chrome-512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=5">
<script defer src="pwa.js?v=1"></script>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Carregando Prompteca">
  <div class="splash-card">
    <div class="splash-logo">
      <img src="image/android-chrome-192x192.png" alt="" width="64" height="64">
    </div>
    <strong class="splash-title">Prompteca</strong>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove();},6000);</script>
<div class="app" id="appRoot" data-panel-open="false">
  <main class="side" id="side" aria-label="Modelos salvos">
    <div class="side-head">
      <div class="brand-row">
        <div class="brand">
          <img src="image/android-chrome-192x192.png" alt="" width="30" height="30">
          <span>Prompteca</span>
        </div>
        <div class="head-right">
          <span id="count" class="count-pill" title="Total de modelos e subprompts">0</span>
          <button class="org-btn" id="orgBtn" type="button" aria-pressed="false" title="Exibir controles para reordenar, editar e excluir">
            Organizar
          </button>
          <div class="auth">
            <button class="user-btn" id="userBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="authPop" aria-label="Conta">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <span class="dot"></span>
            </button>
            <div class="pop" id="authPop" role="dialog" aria-label="Conta" hidden>
              <form id="loginForm" novalidate>
                <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
                <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
                <div class="err" id="authErr"></div>
                <button class="go" id="entrar" type="submit">Entrar</button>
              </form>
              <div id="acct" hidden>
                <div class="who">
                  <span class="av" id="av"></span>
                  <span style="min-width:0">
                    <span class="em" id="whoEmail"></span>
                    <small>Conectado</small>
                  </span>
                </div>
                <button class="out" id="sair" type="button">
                  <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>Sair
                </button>
              </div>
              <div class="pop-pwa install-only" id="installPopWrap" hidden>
                <button class="install-pop-btn" id="installPopBtn" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                  <span>Instalar aplicativo</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar modelo ou subprompt por nome ou conteúdo…" autocomplete="off">
      </label>
      <div class="install-bar install-only" id="installBar" role="region" aria-label="Instalação do aplicativo" hidden>
        <span class="install-bar-txt">Salvar Prompteca na tela inicial como app</span>
        <button class="install-bar-go" id="installBarBtn" type="button">Instalar</button>
        <button class="ib install-bar-close" id="installBarDismiss" type="button" aria-label="Dispensar aviso de instalação" title="Dispensar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="status" id="status" hidden></div>
  </main>

  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="title" hidden>
    <div class="panel-head">
      <h1 id="title">Prompteca</h1>
      <span class="meta" id="meta"></span>
      <button class="ib close-panel-btn" id="closePanelBtn" type="button" aria-label="Fechar painel" title="Fechar (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="body"></div>
  </section>

  <nav class="dock" id="dock" aria-label="Ações principais"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="scrim" id="scrim"></div>

<script type="module" src="app.js?v=5"></script>
</body>
</html>
